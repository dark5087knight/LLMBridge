[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unified_llm"]

[project]
name = "unified-llm-integration-layer"
version = "0.1.0"
description = "Unified LLM Integration Layer (ULIL) - A standardized middleware service for LLM providers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "openai>=1.20.0",
    "google-genai>=0.1.1",
    "groq>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12",
]

[project.entry-points."unified_llm.providers"]
openai = "unified_llm.providers.openai_adapter:OpenAIAdapter"
groq = "unified_llm.providers.groq_adapter:GroqAdapter"
gemini = "unified_llm.providers.gemini_adapter:GeminiAdapter"
ollama = "unified_llm.providers.ollama_adapter:OllamaAdapter"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests requiring external services or live network (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
